<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments – Admin – Need A Witness UK</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="../hub/firebase.js"></script>

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #fafafa;
        color: #222;
    }

    .layout {
        display: flex;
        min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
        width: 260px;
        background: white;
        border-right: 1px solid #eee;
        padding: 24px;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
    }

    .logo {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 600;
        color: #D4AF37;
        margin-bottom: 30px;
    }

    .nav-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #999;
        margin-bottom: 8px;
    }

    .nav-item {
        padding: 10px 12px;
        margin-bottom: 6px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        color: #333;
    }

    .nav-item:hover {
        background: #f5f1e6;
    }

    .nav-item.active {
        background: #D4AF37;
        color: white;
    }

    .sidebar-footer {
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid #eee;
        font-size: 12px;
        color: #777;
        line-height: 1.4;
    }

    .logout-btn {
        margin-top: 16px;
        padding: 10px;
        background: #D4AF37;
        color: white;
        text-align: center;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
    }

    /* MAIN */
    .main {
        flex: 1;
        padding: 30px 40px;
    }

    .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .main-header h1 {
        font-family: "Playfair Display", serif;
        color: #D4AF37;
        margin: 0;
        font-size: 26px;
    }

    .main-subtitle {
        color: #777;
        font-size: 14px;
        margin-top: 4px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        margin-bottom: 24px;
    }

    .section-title {
        font-family: "Playfair Display", serif;
        color: #D4AF37;
        font-size: 20px;
        margin-top: 0;
        margin-bottom: 10px;
    }

    .filters-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    .filters-row input,
    .filters-row select {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fafafa;
        font-size: 14px;
    }

    .payment-row {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr 1fr;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid #f2f2f2;
        font-size: 13px;
        align-items: center;
    }

    .payment-row:last-child {
        border-bottom: none;
    }

    .badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        text-transform: capitalize;
    }

    .pay-unpaid { background: #ffe6e6; color: #8a0000; }
    .pay-deposit { background: #fff4d6; color: #8a6d00; }
    .pay-full { background: #d6ffe0; color: #006d2a; }
    .pay-late { background: #ffd6d6; color: #8a0000; }

    .btn-small {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        margin-right: 4px;
    }

    .btn-small-outline {
        background: white;
        color: #555;
        border: 1px solid #ccc;
    }

    .btn-small-gold {
        background: #D4AF37;
        color: white;
    }

    .totals-box {
        font-size: 14px;
        margin-top: 10px;
        padding: 12px;
        background: #faf7ef;
        border: 1px solid #e8dfc7;
        border-radius: 8px;
    }

</style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">Need A Witness UK</div>

        <div class="nav-title">Navigation</div>
        <div class="nav-item" onclick="window.location.href='admin-dashboard.html'">Dashboard</div>
        <div class="nav-item" onclick="window.location.href='admin-witnesses.html'">Witnesses</div>
        <div class="nav-item" onclick="window.location.href='admin-create-job.html'">Create Job</div>
        <div class="nav-item active">Payments</div>

        <div class="sidebar-footer">
            Admin Panel<br>
            Witness Hub v1.0
            <div class="logout-btn" onclick="adminLogout()">Logout</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="main-header">
            <div>
                <h1>Payments</h1>
                <div class="main-subtitle">Track deposits, full payments, and overdue balances.</div>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="card">
            <div class="section-title">Filters</div>

            <div class="filters-row">
                <select id="filterStatus" onchange="renderPayments()">
                    <option value="all">All Statuses</option>
                    <option value="unpaid">Unpaid</option>
                    <option value="deposit">Deposit Only</option>
                    <option value="full">Fully Paid</option>
                    <option value="late-cancel">Late / Cancelled</option>
                </select>

                <input type="date" id="filterFrom" onchange="renderPayments()">
                <input type="date" id="filterTo" onchange="renderPayments()">

                <select id="filterType" onchange="renderPayments()">
                    <option value="all">All Witness Types</option>
                    <option value="single">Single</option>
                    <option value="couple">Couple</option>
                </select>
            </div>
        </div>

        <!-- PAYMENTS TABLE -->
        <div class="card">
            <div class="section-title">Payment Records</div>
            <div id="paymentsContainer"></div>

            <div class="totals-box" id="totalsBox"></div>
        </div>
    </div>
</div>

<script>
const db = firebase.firestore();
let allJobs = [];

/* LOAD ALL JOBS */
function loadPayments() {
    db.collection("jobs")
      .orderBy("createdAt", "desc")
      .onSnapshot(snapshot => {
        allJobs = [];
        snapshot.forEach(doc => {
            allJobs.push({ id: doc.id, ...doc.data() });
        });
        renderPayments();
      });
}

/* RENDER PAYMENTS */
function renderPayments() {
    const container = document.getElementById("paymentsContainer");
    container.innerHTML = "";

    const statusFilter = document.getElementById("filterStatus").value;
    const typeFilter = document.getElementById("filterType").value;
    const from = document.getElementById("filterFrom").value;
    const to = document.getElementById("filterTo").value;

    const fromDate = from ? new Date(from) : null;
    const toDate = to ? new Date(to) : null;

    let totalRevenue = 0;
    let totalDeposits = 0;
    let totalRemaining = 0;
    let totalLost = 0;

    allJobs
        .filter(j => {
            // Status filter
            if (statusFilter !== "all" && j.paymentStatus !== statusFilter) return false;

            // Witness type filter
            if (typeFilter !== "all" && j.witnessType !== typeFilter) return false;

            // Date filter (ceremony date)
            if (j.date) {
                const d = new Date(j.date);
                if (fromDate && d < fromDate) return false;
                if (toDate && d > toDate) return false;
            }

            return true;
        })
        .forEach(j => {
            const ps = j.paymentStatus || "unpaid";
            const payClass =
                ps === "full" ? "pay-full" :
                ps === "deposit" ? "pay-deposit" :
                ps === "late-cancel" ? "pay-late" : "pay-unpaid";

            const payLabel =
                ps === "full" ? "Paid in full" :
                ps === "deposit" ? "Deposit only" :
                ps === "late-cancel" ? "Late / Cancelled" : "Unpaid";

            // Totals
            if (ps === "full") totalRevenue += j.totalPrice || 0;
            if (ps === "deposit") totalDeposits += j.depositAmount || 20;
            if (ps === "unpaid") totalRemaining += j.totalPrice || 0;
            if (ps === "late-cancel") totalLost += j.depositAmount || 20;

            const row = document.createElement("div");
            row.className = "payment-row";
            row.innerHTML = `
                <div>
                    <b>${j.coupleName || "Unnamed Couple"}</b><br>
                    <span style="font-size:12px;color:#777;">${j.date || ""} ${j.time || ""}</span>
                </div>

                <div>£${j.totalPrice || 0}</div>
                <div>£${j.amountPaid || 0}</div>
                <div>£${j.amountDue || 0}</div>

                <div>
                    <span class="badge ${payClass}">${payLabel}</span>
                </div>

                <div>
                    <button class="btn-small btn-small-outline" onclick="openJob('${j.id}')">Open</button>
                    <button class="btn-small btn-small-outline" onclick="markDepositPaid('${j.id}')">Deposit</button>
                    <button class="btn-small btn-small-outline" onclick="markRemainingPaid('${j.id}')">Full</button>
                </div>
            `;
            container.appendChild(row);
        });

    document.getElementById("totalsBox").innerHTML = `
        <b>Totals:</b><br>
        Revenue (Full Payments): £${totalRevenue}<br>
        Deposits Only: £${totalDeposits}<br>
        Unpaid Value: £${totalRemaining}<br>
        Lost to Late Cancellations: £${totalLost}
    `;
}

/* ACTIONS */
function openJob(id) {
    window.location.href = `admin-job-detail.html?id=${id}`;
}

function markDepositPaid(id) {
    if (!confirm("Mark deposit paid?")) return;

    const ref = db.collection("jobs").doc(id);
    ref.get().then(doc => {
        const j = doc.data();
        const deposit = j.depositAmount || 20;
        const newPaid = (j.amountPaid || 0) + deposit;
        const newDue = Math.max((j.totalPrice || 0) - newPaid, 0);

        ref.update({
            paymentStatus: newDue > 0 ? "deposit" : "full",
            amountPaid: newPaid,
            amountDue: newDue,
            depositPaidAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    });
}

function markRemainingPaid(id) {
    if (!confirm("Mark remaining paid?")) return;

    const ref = db.collection("jobs").doc(id);
    ref.get().then(doc => {
        const j = doc.data();
        const total = j.totalPrice || 0;

        ref.update({
            paymentStatus: "full",
            amountPaid: total,
            amountDue: 0,
            remainingPaidAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    });
}

/* LOGOUT */
function adminLogout() {
    firebase.auth().signOut().then(() => {
        window.location.href = "admin-login.html";
    });
}

/* INIT */
loadPayments();
</script>

</body>
</html>
