<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard – Need A Witness UK</title>

<!-- BRAND FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #fafafa;
        color: #222;
    }

    /* SIDEBAR */
    .sidebar {
        width: 240px;
        height: 100vh;
        background: white;
        border-right: 1px solid #eee;
        position: fixed;
        top: 0;
        left: 0;
        padding: 20px;
    }

    .logo {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 600;
        color: #D4AF37;
        margin-bottom: 30px;
    }

    .nav-item {
        padding: 12px 10px;
        margin-bottom: 8px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
    }

    .nav-item.active {
        background: #D4AF37;
        color: white;
    }

    /* MAIN CONTENT */
    .main {
        margin-left: 260px;
        padding: 30px;
    }

    h2 {
        font-family: "Playfair Display", serif;
        color: #D4AF37;
        margin-top: 0;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        margin-bottom: 30px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 15px;
    }

    button {
        background: #D4AF37;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 15px;
    }

    button:hover {
        opacity: 0.9;
    }

    /* JOB LIST */
    .job-card {
        background: white;
        padding: 18px;
        border-radius: 10px;
        border-left: 5px solid #D4AF37;
        margin-bottom: 15px;
    }

    .job-header {
        font-weight: 600;
        font-size: 17px;
        margin-bottom: 6px;
    }

    .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        margin-left: 10px;
    }

    .pending { background: #fff4d6; color: #8a6d00; }
    .assigned { background: #d6ffe0; color: #006d2a; }
    .completed { background: #e6e6e6; color: #555; }
    .cancelled { background: #ffd6d6; color: #8a0000; }

    /* MODAL */
    .modal-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
        display: none;
        justify-content: center;
        align-items: center;
    }

    .modal {
        background: white;
        width: 500px;
        padding: 25px;
        border-radius: 10px;
    }

    .witness-item {
        padding: 10px;
        border-bottom: 1px solid #eee;
    }

    .witness-item label {
        cursor: pointer;
        display: flex;
        justify-content: space-between;
    }
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">Need A Witness UK</div>
    <div class="nav-item active">Admin Dashboard</div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- CREATE JOB -->
    <div class="card">
        <h2>Create New Job</h2>

        <input id="coupleName" placeholder="Couple Name">
        <input id="coupleEmail" placeholder="Couple Email">
        <input id="jobDate" type="date">
        <input id="jobTime" type="time">
        <input id="jobLocation" placeholder="Location">
        <textarea id="jobNotes" placeholder="Notes"></textarea>

        <label>Witness Type Needed</label>
        <select id="witnessType">
            <option value="single">Single Witness</option>
            <option value="couple">Couple Team</option>
            <option value="either">Either</option>
        </select>

        <button onclick="createJob()">Create Job</button>
    </div>

    <!-- PENDING REQUESTS -->
    <div class="card">
        <h2>Pending Requests</h2>
        <div id="pendingRequests"></div>
    </div>

    <!-- ALL JOBS -->
    <div class="card">
        <h2>All Jobs</h2>
        <div id="allJobs"></div>
    </div>

</div>

<!-- ASSIGN WITNESS MODAL -->
<div class="modal-bg" id="assignModal">
    <div class="modal">
        <h3>Assign Witnesses</h3>
        <div id="witnessList"></div>
        <button onclick="confirmAssignment()">Assign Selected</button>
        <button style="background:#999;margin-left:10px" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
// FIREBASE CONFIG
firebase.initializeApp({
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT_ID"
});

const db = firebase.firestore();

let selectedJobId = null;

/* -------------------------
   CREATE JOB
-------------------------- */
function createJob() {
    const job = {
        coupleName: coupleName.value,
        coupleEmail: coupleEmail.value,
        date: jobDate.value,
        time: jobTime.value,
        location: jobLocation.value,
        notes: jobNotes.value,
        witnessType: witnessType.value,
        assignedWitnesses: [],
        requestBy: "",
        requestTeamName: "",
        requestStatus: null,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    db.collection("jobs").add(job).then(() => {
        alert("Job created!");
    });
}

/* -------------------------
   LOAD PENDING REQUESTS
-------------------------- */
function loadPendingRequests() {
    db.collection("jobs")
      .where("requestStatus", "==", "pending")
      .onSnapshot(snapshot => {
        pendingRequests.innerHTML = "";
        snapshot.forEach(doc => {
            const j = doc.data();
            pendingRequests.innerHTML += `
                <div class="job-card">
                    <div class="job-header">${j.coupleName}</div>
                    <div>Requested by: <b>${j.requestTeamName}</b></div>
                    <button onclick="openAssignModal('${doc.id}')">Assign</button>
                    <button style="background:#999;margin-left:10px" onclick="rejectRequest('${doc.id}')">Reject</button>
                </div>
            `;
        });
    });
}

/* -------------------------
   LOAD ALL JOBS
-------------------------- */
function loadAllJobs() {
    db.collection("jobs")
      .orderBy("createdAt", "desc")
      .onSnapshot(snapshot => {
        allJobs.innerHTML = "";
        snapshot.forEach(doc => {
            const j = doc.data();
            const badge = j.status === "pending" ? "pending" :
                          j.status === "assigned" ? "assigned" :
                          j.status === "completed" ? "completed" : "cancelled";

            allJobs.innerHTML += `
                <div class="job-card">
                    <div class="job-header">
                        ${j.coupleName}
                        <span class="status-badge ${badge}">${j.status}</span>
                    </div>
                    <div>${j.date} at ${j.time}</div>
                    <div>${j.location}</div>
                    <button onclick="openAssignModal('${doc.id}')">Assign / Edit</button>
                </div>
            `;
        });
    });
}

/* -------------------------
   OPEN ASSIGN MODAL
-------------------------- */
function openAssignModal(jobId) {
    selectedJobId = jobId;
    assignModal.style.display = "flex";

    db.collection("users").get().then(snapshot => {
        witnessList.innerHTML = "";
        snapshot.forEach(doc => {
            const u = doc.data();

            const type = u.type === "couple" ? "Couple Team" : "Single";
            const avail = u.availability ? "Available" : "No availability set";

            witnessList.innerHTML += `
                <div class="witness-item">
                    <label>
                        <span>
                            <input type="checkbox" value="${doc.id}">
                            ${u.fullName || u.teamName} — ${type}
                        </span>
                        <span>${avail}</span>
                    </label>
                </div>
            `;
        });
    });
}

function closeModal() {
    assignModal.style.display = "none";
}

/* -------------------------
   CONFIRM ASSIGNMENT
-------------------------- */
function confirmAssignment() {
    const checkboxes = document.querySelectorAll("#witnessList input[type='checkbox']");
    const selected = [];

    checkboxes.forEach(cb => {
        if (cb.checked) selected.push(cb.value);
    });

    db.collection("jobs").doc(selectedJobId).update({
        assignedWitnesses: selected,
        status: "assigned",
        requestStatus: null
    });

    closeModal();
}

/* -------------------------
   REJECT REQUEST
-------------------------- */
function rejectRequest(jobId) {
    db.collection("jobs").doc(jobId).update({
        requestStatus: "rejected"
    });
}

/* INIT */
loadPendingRequests();
loadAllJobs();
</script>

</body>
</html>
