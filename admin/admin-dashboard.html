<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Witness Hub – Admin Dashboard</title>

    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="../hub/firebase.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #000;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        header button {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 3fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .small {
            font-size: 13px;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        button {
            padding: 10px 15px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .rejectBtn {
            background: #b30000;
            margin-left: 10px;
        }

        .rejectBtn:hover {
            background: #800000;
        }

        .user-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .user-photo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
            border: 1px solid #ddd;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            font-size: 14px;
        }

        .user-meta {
            font-size: 12px;
            color: #666;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            background: #eee;
            margin-left: 5px;
        }

        .job-row {
            border-bottom: 1px solid #eee;
            padding: 8px 0;
        }

        .job-meta {
            font-size: 13px;
            color: #555;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            background: #eee;
            margin-left: 5px;
        }

        .status-pending { background: #fff3cd; }
        .status-assigned { background: #d4edda; }
        .status-completed { background: #cce5ff; }
        .status-cancelled { background: #f8d7da; }
    </style>
</head>
<body>

<header>
    <h1>Admin Dashboard</h1>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

    <div id="status" class="card">
        <h2>Welcome</h2>
        <p class="small" id="adminInfo">Checking admin permissions…</p>
    </div>

    <div class="grid">
        <!-- USERS OVERVIEW -->
        <div class="card">
            <h2>Witnesses</h2>
            <p class="small">All registered witnesses with profile info.</p>
            <div id="usersList">Loading users…</div>
        </div>

        <!-- CREATE JOB -->
        <div class="card">
            <h2>Create Job</h2>
            <p class="small">Create a job using the new structure.</p>

            <input id="coupleName" type="text" placeholder="Couple Name (e.g., John & Sarah)">
            <input id="coupleEmail" type="email" placeholder="Couple Email">
            <input id="jobDate" type="date">
            <input id="jobTime" type="time">
            <input id="jobLocation" type="text" placeholder="Ceremony Location">
            <textarea id="jobNotes" placeholder="Notes (optional)"></textarea>

            <select id="witnessType">
                <option value="single">Single Witness</option>
                <option value="couple">Couple Witness Team</option>
            </select>

            <button onclick="createJob()">Add Job</button>
        </div>
    </div>

    <!-- PENDING JOBS -->
    <div class="card">
        <h2>Pending Jobs</h2>
        <p class="small">Jobs not yet assigned to a witness.</p>
        <div id="pendingJobs">Loading…</div>
    </div>

    <!-- ALL JOBS -->
    <div class="card">
        <h2>All Jobs</h2>
        <div id="allJobs">Loading…</div>
    </div>

</div>

<script>
    // SECURE ADMIN CHECK
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'admin-login.html';
            return;
        }

        const email = user.email;
        const adminDoc = await db.collection('admins').doc(email).get();

        if (!adminDoc.exists || adminDoc.data().role !== 'admin') {
            await auth.signOut();
            window.location.href = 'admin-login.html';
            return;
        }

        document.getElementById("adminInfo").textContent =
            `Logged in as ${email} (admin)`;

        loadUsers();
        loadPendingJobs();
        loadAllJobs();
    });

    // LOAD USERS
    function loadUsers() {
        db.collection("users")
            .orderBy("createdAt", "desc")
            .onSnapshot(snapshot => {
                const container = document.getElementById("usersList");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p>No users found.</p>";
                    return;
                }

                snapshot.forEach(doc => {
                    const user = doc.data();
                    const id = doc.id;

                    const row = document.createElement("div");
                    row.className = "user-row";

                    const img = document.createElement("img");
                    img.className = "user-photo";
                    img.src = user.photoURL || "default-avatar.png";

                    const info = document.createElement("div");
                    info.className = "user-info";

                    const name = document.createElement("div");
                    name.className = "user-name";

                    if (user.type === "couple") {
                        name.textContent = user.teamName || "Couple Witness";
                        const badge = document.createElement("span");
                        badge.className = "badge";
                        badge.textContent = "Couple";
                        name.appendChild(badge);
                    } else {
                        name.textContent = user.name || "Single Witness";
                        const badge = document.createElement("span");
                        badge.className = "badge";
                        badge.textContent = "Single";
                        name.appendChild(badge);
                    }

                    const meta = document.createElement("div");
                    meta.className = "user-meta";
                    meta.textContent = `${user.email || id} • ${user.location || "No location set"}`;

                    info.appendChild(name);
                    info.appendChild(meta);

                    row.appendChild(img);
                    row.appendChild(info);

                    container.appendChild(row);
                });
            });
    }

    // CREATE JOB (NEW STRUCTURE)
    function createJob() {
        const coupleName = document.getElementById("coupleName").value.trim();
        const coupleEmail = document.getElementById("coupleEmail").value.trim();
        const date = document.getElementById("jobDate").value;
        const time = document.getElementById("jobTime").value;
        const location = document.getElementById("jobLocation").value.trim();
        const notes = document.getElementById("jobNotes").value.trim();
        const witnessType = document.getElementById("witnessType").value;

        if (!coupleName || !coupleEmail || !date || !time || !location) {
            alert("Please fill in couple name, email, date, time, and location.");
            return;
        }

        db.collection("jobs").add({
            coupleName,
            coupleEmail,
            date,
            time,
            location,
            notes: notes || null,
            witnessType,              // "single" or "couple"
            assignedWitnesses: [],    // array of witness UIDs
            status: "pending",        // pending | assigned | completed | cancelled
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("Job created successfully.");
            document.getElementById("coupleName").value = "";
            document.getElementById("coupleEmail").value = "";
            document.getElementById("jobDate").value = "";
            document.getElementById("jobTime").value = "";
            document.getElementById("jobLocation").value = "";
            document.getElementById("jobNotes").value = "";
            document.getElementById("witnessType").value = "single";
        });
    }

    // LOAD PENDING JOBS (status = pending)
    function loadPendingJobs() {
        db.collection("jobs")
            .where("status", "==", "pending")
            .orderBy("createdAt", "desc")
            .onSnapshot(snapshot => {
                const container = document.getElementById("pendingJobs");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p>No pending jobs.</p>";
                    return;
                }

                snapshot.forEach(doc => {
                    const job = doc.data();
                    const id = doc.id;

                    const div = document.createElement("div");
                    div.className = "job-row";
                    div.innerHTML = `
                        <strong>${job.coupleName || "Unnamed couple"}</strong>
                        <span class="status-badge status-pending">Pending</span>
                        <div class="job-meta">
                            ${job.date || "No date"} • ${job.time || "No time"} • ${job.location || "No location"}
                        </div>
                        <div class="job-meta">
                            Witness type: ${job.witnessType || "N/A"}
                        </div>
                        <button onclick="markAssigned('${id}')">Mark Assigned</button>
                        <button class="rejectBtn" onclick="cancelJob('${id}')">Cancel</button>
                    `;
                    container.appendChild(div);
                });
            });
    }

    // LOAD ALL JOBS
    function loadAllJobs() {
        db.collection("jobs")
            .orderBy("createdAt", "desc")
            .onSnapshot(snapshot => {
                const container = document.getElementById("allJobs");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p>No jobs found.</p>";
                    return;
                }

                snapshot.forEach(doc => {
                    const job = doc.data();
                    const id = doc.id;

                    let statusClass = "status-badge";
                    if (job.status === "pending") statusClass += " status-pending";
                    if (job.status === "assigned") statusClass += " status-assigned";
                    if (job.status === "completed") statusClass += " status-completed";
                    if (job.status === "cancelled") statusClass += " status-cancelled";

                    const div = document.createElement("div");
                    div.className = "job-row";
                    div.innerHTML = `
                        <strong>${job.coupleName || "Unnamed couple"}</strong>
                        <span class="${statusClass}">${job.status || "unknown"}</span>
                        <div class="job-meta">
                            ${job.date || "No date"} • ${job.time || "No time"} • ${job.location || "No location"}
                        </div>
                        <div class="job-meta">
                            Witness type: ${job.witnessType || "N/A"} • Assigned: ${(job.assignedWitnesses || []).length} witness(es)
                        </div>
                        <button onclick="markCompleted('${id}')">Mark Completed</button>
                        <button class="rejectBtn" onclick="cancelJob('${id}')">Cancel</button>
                    `;
                    container.appendChild(div);
                });
            });
    }

    // SIMPLE STATUS HELPERS
    function markAssigned(jobId) {
        db.collection("jobs").doc(jobId).update({
            status: "assigned"
        }).then(() => {
            alert("Job marked as assigned.");
        });
    }

    function markCompleted(jobId) {
        db.collection("jobs").doc(jobId).update({
            status: "completed"
        }).then(() => {
            alert("Job marked as completed.");
        });
    }

    function cancelJob(jobId) {
        db.collection("jobs").doc(jobId).update({
            status: "cancelled"
        }).then(() => {
            alert("Job cancelled.");
        });
    }

    // LOGOUT
    function logout() {
        auth.signOut().then(() => {
            window.location.href = "admin-login.html";
        });
    }
</script>

</body>
</html>
