<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Witness Detail – Admin – Need A Witness UK</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="../hub/firebase.js"></script>

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #f4f4f6;
        color: #222;
    }

    .layout {
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        width: 260px;
        background: #ffffff;
        border-right: 1px solid #eee;
        padding: 24px;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
    }

    .logo {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        font-weight: 600;
        color: #D4AF37;
        margin-bottom: 30px;
    }

    .nav-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #999;
        margin-bottom: 8px;
    }

    .nav-item {
        padding: 10px 12px;
        margin-bottom: 6px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        color: #333;
    }

    .nav-item:hover {
        background: #f5f1e6;
    }

    .nav-item.active {
        background: #D4AF37;
        color: white;
    }

    .sidebar-footer {
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid #eee;
        font-size: 12px;
        color: #777;
        line-height: 1.4;
    }

    .logout-btn {
        margin-top: 16px;
        padding: 10px;
        background: #D4AF37;
        color: white;
        text-align: center;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
    }

    .main {
        flex: 1;
        padding: 30px 40px;
    }

    .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .main-header h1 {
        font-family: "Playfair Display", serif;
        color: #D4AF37;
        margin: 0;
        font-size: 26px;
    }

    .main-subtitle {
        color: #777;
        font-size: 14px;
        margin-top: 4px;
    }

    .back-link {
        font-size: 14px;
        color: #555;
        cursor: pointer;
        text-decoration: underline;
    }

    .top-row {
        display: grid;
        grid-template-columns: 280px 1.2fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .card {
        background: white;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .profile-photo {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #D4AF37;
        margin-bottom: 10px;
    }

    .profile-name {
        font-weight: 600;
        font-size: 18px;
    }

    .profile-type {
        font-size: 13px;
        color: #777;
        margin-top: 2px;
    }

    .profile-meta {
        font-size: 13px;
        color: #555;
        margin-top: 4px;
    }

    .badge-status {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        text-transform: capitalize;
        margin-top: 6px;
    }

    .status-active { background: #d6ffe0; color: #006d2a; }
    .status-suspended { background: #ffd6d6; color: #8a0000; }

    .rating {
        font-size: 20px;
        font-weight: 600;
    }

    .rating-label {
        font-size: 13px;
        color: #777;
    }

    .btn-small {
        padding: 7px 11px;
        font-size: 12px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        margin-right: 6px;
        margin-top: 6px;
    }

    .btn-gold {
        background: #D4AF37;
        color: white;
    }

    .btn-grey {
        background: #999;
        color: white;
    }

    .btn-outline {
        background: white;
        color: #555;
        border: 1px solid #ccc;
    }

    textarea {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 14px;
        resize: vertical;
        min-height: 80px;
        background: #fafafa;
    }

    .section-title {
        font-family: "Playfair Display", serif;
        color: #D4AF37;
        font-size: 20px;
        margin-bottom: 10px;
    }

    .filters-row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    .filters-row input,
    .filters-row select {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 13px;
        background: #fafafa;
    }

    .job-card {
        background: #fff;
        padding: 12px;
        border-radius: 10px;
        border-left: 4px solid #D4AF37;
        margin-bottom: 10px;
        font-size: 14px;
    }

    .job-header {
        font-weight: 600;
        margin-bottom: 4px;
    }

    .job-meta {
        color: #555;
        margin-bottom: 4px;
    }

    .status-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        text-transform: capitalize;
        margin-left: 6px;
    }

    .pending { background: #fff4d6; color: #8a6d00; }
    .assigned { background: #d6ffe0; color: #006d2a; }
    .completed { background: #e6e6e6; color: #555; }
    .cancelled { background: #ffd6d6; color: #8a0000; }
</style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">Need A Witness UK</div>

        <div class="nav-title">Navigation</div>
        <div class="nav-item" onclick="window.location.href='admin-dashboard.html'">Dashboard</div>
        <div class="nav-item" onclick="window.location.href='admin-witnesses.html'">Witnesses</div>

        <div class="sidebar-footer">
            Admin Panel<br>
            Witness Hub v1.0
            <div class="logout-btn" onclick="adminLogout()">Logout</div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="main-header">
            <div>
                <div class="back-link" onclick="window.location.href='admin-witnesses.html'">← Back to Witnesses</div>
                <h1 id="witnessNameHeading">Witness</h1>
                <div class="main-subtitle" id="witnessSubtitle"></div>
            </div>
        </div>

        <!-- TOP ROW: PROFILE / NOTES / AVAILABILITY SUMMARY -->
        <div class="top-row">
            <!-- PROFILE CARD -->
            <div class="card" id="profileCard">
                <img id="profilePhoto" class="profile-photo" src="https://via.placeholder.com/90x90?text=W">
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-type" id="profileType"></div>
                <div class="profile-meta" id="profileEmail"></div>
                <div class="profile-meta" id="profileLocation"></div>
                <div class="profile-meta" id="profilePhone"></div>
                <div class="profile-meta" id="profileBio"></div>
                <div id="profileStatusBadge"></div>
                <div style="margin-top:8px;">
                    <span class="rating" id="profileRating">⭐ 5.0</span>
                    <span class="rating-label">Rating</span>
                </div>
                <div style="margin-top:8px;">
                    <button class="btn-small btn-outline" onclick="promptRating()">Edit Rating</button>
                    <button class="btn-small btn-grey" onclick="toggleStatus()">Toggle Status</button>
                </div>
            </div>

            <!-- INTERNAL NOTES -->
            <div class="card">
                <div class="section-title">Internal Notes</div>
                <textarea id="adminNotes" placeholder="Private notes only admins can see (reliability, preferences, issues, etc.)"></textarea>
                <button class="btn-small btn-gold" style="margin-top:8px;" onclick="saveNotes()">Save Notes</button>
            </div>

            <!-- AVAILABILITY SUMMARY -->
            <div class="card">
                <div class="section-title">Availability</div>
                <div id="availabilitySummary">Loading...</div>
                <button class="btn-small btn-outline" style="margin-top:8px;" onclick="alert('For now, edit availability from the witness side. We can build a full admin editor next.')">
                    Edit Availability (coming soon)
                </button>
            </div>
        </div>

        <!-- JOBS SECTION -->
        <div class="card">
            <div class="section-title">Jobs for this Witness</div>

            <div class="filters-row">
                <input type="date" id="filterFrom" onchange="renderJobs()">
                <input type="date" id="filterTo" onchange="renderJobs()">
                <select id="filterStatus" onchange="renderJobs()">
                    <option value="all">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="assigned">Assigned</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <div id="jobsContainer"></div>
        </div>
    </div>
</div>

<script>
const db = firebase.firestore();
let witnessId = null;
let witnessData = null;
let witnessJobs = [];

/* GET UID FROM URL */
function getWitnessIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
}

/* LOAD WITNESS DATA */
async function loadWitness() {
    witnessId = getWitnessIdFromUrl();
    if (!witnessId) {
        alert("No witness ID provided.");
        window.location.href = "admin-witnesses.html";
        return;
    }

    const doc = await db.collection("users").doc(witnessId).get();
    if (!doc.exists) {
        alert("Witness not found.");
        window.location.href = "admin-witnesses.html";
        return;
    }

    witnessData = doc.data();
    renderWitnessProfile();
    loadWitnessJobs();
}

/* RENDER PROFILE */
function renderWitnessProfile() {
    const w = witnessData;

    const displayName =
        w.type === "couple"
            ? (w.teamName || `${w.partner1Name || ""} & ${w.partner2Name || ""}`)
            : (w.name || w.fullName || "Unnamed");

    const typeLabel = w.type === "couple" ? "Couple Team" : "Single Witness";
    const photo = w.photoURL || "https://via.placeholder.com/90x90?text=W";
    const rating = typeof w.rating === "number" ? w.rating.toFixed(1) : (w.rating || "N/A");
    const status = w.status || "active";
    const statusClass = status === "suspended" ? "status-suspended" : "status-active";

    document.getElementById("profilePhoto").src = photo;
    document.getElementById("profileName").innerText = displayName;
    document.getElementById("profileType").innerText = typeLabel;
    document.getElementById("profileEmail").innerText = w.email || "";
    document.getElementById("profileLocation").innerText = w.location ? `Location: ${w.location}` : "";
    document.getElementById("profilePhone").innerText = w.phone ? `Phone: ${w.phone}` : "";
    document.getElementById("profileBio").innerText = w.bio ? `Bio: ${w.bio}` : "";

    document.getElementById("profileRating").innerText = `⭐ ${rating}`;
    document.getElementById("witnessNameHeading").innerText = displayName;
    document.getElementById("witnessSubtitle").innerText = `${typeLabel} • ${w.email || ""}`;

    const statusBadge = document.getElementById("profileStatusBadge");
    statusBadge.innerHTML = `<span class="badge-status ${statusClass}">${status}</span>`;

    // Internal notes
    document.getElementById("adminNotes").value = w.adminNotes || "";

    // Availability summary
    const availDiv = document.getElementById("availabilitySummary");
    if (w.availability) {
        let html = "";
        const order = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
        order.forEach(day => {
            const info = w.availability[day];
            if (!info) return;
            html += `<div style="font-size:13px;margin-bottom:3px;"><strong>${day}:</strong> ${
                info.enabled ? `${info.start}–${info.end}` : "Not available"
            }</div>`;
        });
        availDiv.innerHTML = html || "<p>No availability set.</p>";
    } else {
        availDiv.innerHTML = "<p>No availability set.</p>";
    }
}

/* SAVE NOTES */
function saveNotes() {
    const notes = document.getElementById("adminNotes").value.trim();
    db.collection("users").doc(witnessId).update({
        adminNotes: notes
    }).then(() => {
        alert("Notes saved.");
    });
}

/* PROMPT RATING */
function promptRating() {
    const current = witnessData.rating || 5;
    const newRatingStr = prompt("Set new rating (0–5):", current);
    if (newRatingStr === null) return;

    const newRating = parseFloat(newRatingStr);
    if (isNaN(newRating) || newRating < 0 || newRating > 5) {
        alert("Please enter a number between 0 and 5.");
        return;
    }

    db.collection("users").doc(witnessId).update({
        rating: newRating
    }).then(() => {
        witnessData.rating = newRating;
        renderWitnessProfile();
    });
}

/* TOGGLE STATUS */
function toggleStatus() {
    const current = witnessData.status || "active";
    const newStatus = current === "suspended" ? "active" : "suspended";

    db.collection("users").doc(witnessId).update({
        status: newStatus
    }).then(() => {
        witnessData.status = newStatus;
        renderWitnessProfile();
    });
}

/* LOAD JOBS FOR THIS WITNESS */
function loadWitnessJobs() {
    db.collection("jobs")
      .where("assignedWitnesses", "array-contains", witnessId)
      .onSnapshot(snapshot => {
        witnessJobs = [];
        snapshot.forEach(doc => {
            witnessJobs.push({
                id: doc.id,
                ...doc.data()
            });
        });
        renderJobs();
    });
}

/* RENDER JOBS WITH FILTERS */
function renderJobs() {
    const container = document.getElementById("jobsContainer");
    const from = document.getElementById("filterFrom").value;
    const to = document.getElementById("filterTo").value;
    const statusFilter = document.getElementById("filterStatus").value;

    container.innerHTML = "";

    if (!witnessJobs.length) {
        container.innerHTML = "<p>No jobs assigned to this witness.</p>";
        return;
    }

    const fromDate = from ? new Date(from) : null;
    const toDate = to ? new Date(to) : null;

    witnessJobs
        .filter(j => {
            // Status filter
            if (statusFilter !== "all" && j.status !== statusFilter) return false;

            // Date filter
            if (j.date) {
                const jobDate = new Date(j.date);
                if (fromDate && jobDate < fromDate) return false;
                if (toDate && jobDate > toDate) return false;
            }

            return true;
        })
        .sort((a, b) => (a.date || "").localeCompare(b.date || ""))
        .forEach(j => {
            const badgeClass =
                j.status === "pending" ? "pending" :
                j.status === "assigned" ? "assigned" :
                j.status === "completed" ? "completed" : "cancelled";

            const div = document.createElement("div");
            div.className = "job-card";
            div.innerHTML = `
                <div class="job-header">
                    ${j.coupleName || "Unnamed Couple"}
                    <span class="status-badge ${badgeClass}">${j.status}</span>
                </div>
                <div class="job-meta">${j.date || ""} ${j.time || ""} — ${j.location || ""}</div>
                <div style="font-size:13px;color:#777;margin-bottom:6px;">Notes: ${j.notes || "None"}</div>
                <button class="btn-small btn-outline" onclick="removeFromJob('${j.id}')">Remove this witness from job</button>
            `;
            container.appendChild(div);
        });
}

/* REMOVE WITNESS FROM JOB */
function removeFromJob(jobId) {
    if (!confirm("Remove this witness from this job?")) return;

    const jobRef = db.collection("jobs").doc(jobId);
    jobRef.update({
        assignedWitnesses: firebase.firestore.FieldValue.arrayRemove(witnessId)
    });
}

/* ADMIN LOGOUT */
function adminLogout() {
    firebase.auth().signOut().then(() => {
        window.location.href = "admin-login.html";
    });
}

/* INIT */
loadWitness();
</script>

</body>
</html>
