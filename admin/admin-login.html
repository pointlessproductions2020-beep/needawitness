<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Witness Hub – Admin Login</title>

    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            width: 360px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #333;
        }

        p {
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #000;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            opacity: 0.7;
        }

        .error {
            color: red;
            font-size: 13px;
            min-height: 18px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Admin Login</h1>

    <div id="error" class="error"></div>

    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="adminLogin()">Login</button>

    <p><a href="login.html">Back to Witness Login</a></p>
</div>

<script src="firebase.js"></script>

<script>
async function adminLogin() {
    const email = document.getElementById("email").value.trim();
    const pass  = document.getElementById("password").value.trim();
    const errorBox = document.getElementById("error");
    errorBox.textContent = "";

    if (!email || !pass) {
        errorBox.textContent = "Please enter email and password.";
        return;
    }

    try {
        const cred = await auth.signInWithEmailAndPassword(email, pass);

        // Check if this email exists in the admins collection
        const snap = await db.collection("admins")
            .where("email", "==", email)
            .limit(1)
            .get();

        if (snap.empty) {
            // Not an admin – log out immediately
            await auth.signOut();
            errorBox.textContent = "This account is not authorised as an admin.";
            return;
        }

        // Admin confirmed – go to admin dashboard
        window.location.href = "admin-dashboard.html";

    } catch (err) {
        errorBox.textContent = err.message;
    }
}
</script>

</body>
</html>
