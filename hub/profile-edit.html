<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile – Witness Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #f5f4f2;
        color: #333;
    }

    .layout {
        display: flex;
        min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
        width: 250px;
        background: #ffffff;
        border-right: 1px solid #e6e2da;
        padding: 28px;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 10px rgba(0,0,0,0.04);
    }

    .sidebar h2 {
        font-family: "Playfair Display", serif;
        color: #c8a24a;
        margin: 0 0 32px 0;
        font-size: 26px;
        letter-spacing: 0.5px;
    }

    .sidebar a {
        color: #444;
        text-decoration: none;
        padding: 12px 0;
        display: block;
        font-size: 15px;
        font-weight: 500;
        transition: 0.2s;
    }

    .sidebar a:hover {
        color: #c8a24a;
        transform: translateX(3px);
    }

    .sidebar a.active {
        color: #c8a24a;
        font-weight: 600;
    }

    .logout-btn {
        margin-top: auto;
        padding: 12px;
        background: #c8a24a;
        color: white;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: 0.2s;
    }

    .logout-btn:hover {
        opacity: 0.9;
    }

    .sidebar-footer {
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid #eee;
        font-size: 12px;
        color: #777;
        line-height: 1.4;
    }

    /* MAIN */
    .main {
        flex: 1;
        padding: 40px 48px;
        overflow-y: auto;
    }

    .header {
        font-size: 32px;
        font-family: "Playfair Display", serif;
        color: #c8a24a;
        margin-bottom: 10px;
    }

    .subheader {
        font-size: 14px;
        color: #777;
        margin-bottom: 28px;
    }

    .card {
        background: white;
        padding: 32px 30px;
        border-radius: 16px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        max-width: 760px;
    }

    /* PHOTO */
    .photo-row {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .photo-wrapper {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 3px solid #c8a24a;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf7ec;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        position: relative;
    }

    #photoPreview {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* GOLD RING LOADER */
    .ring-loader {
        position: absolute;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 6px solid rgba(200,162,74,0.25);
        border-top-color: #c8a24a;
        animation: ringSpin 1s linear infinite;
        display: none;
        z-index: 10;
    }

    @keyframes ringSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .photo-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
    }

    .photo-btn {
        padding: 9px 14px;
        border-radius: 8px;
        border: 1px solid #c8a24a;
        background: #fff;
        color: #c8a24a;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        max-width: 200px;
        transition: 0.2s;
    }

    .photo-btn:hover {
        background: #faf4e2;
    }

    .photo-hint {
        font-size: 12px;
        color: #777;
    }

    /* FORM */
    label {
        font-weight: 600;
        display: block;
        margin-top: 18px;
        font-size: 14px;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 14px;
        background: #fafafa;
        transition: 0.2s;
    }

    input:focus, textarea:focus {
        border-color: #c8a24a;
        outline: none;
        background: #fff;
    }

    textarea {
        height: 120px;
        resize: none;
    }

    .save-bar {
        margin-top: 28px;
        display: flex;
        justify-content: flex-end;
    }

    .save-btn {
        padding: 12px 22px;
        background: #c8a24a;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
    }

    .save-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #statusMessage {
        margin-top: 12px;
        font-size: 13px;
        color: #777;
    }

    @media (max-width: 900px) {
        .layout {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            border-right: none;
            border-bottom: 1px solid #eee;
            flex-direction: row;
            align-items: center;
            gap: 18px;
            overflow-x: auto;
        }
        .sidebar h2 {
            margin-bottom: 0;
        }
        .sidebar a {
            padding: 8px 0;
            white-space: nowrap;
        }
        .logout-btn, .sidebar-footer {
            display: none;
        }
        .main {
            padding: 24px;
        }
    }
</style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Witness Hub</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="myjobs.html">My Jobs</a>
        <a href="availability.html">Availability</a>
        <a href="profile.html">Profile</a>
        <a href="profile-edit.html" class="active">Edit Profile</a>

        <div class="logout-btn" onclick="logout()">Logout</div>

        <div class="sidebar-footer">
            © Need A Witness UK<br>
            Witness Hub v1.0
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="header">Edit Your Profile</div>
        <div class="subheader">
            Update your details and profile photo. Couples will see this when choosing their witnesses.
        </div>

        <div class="card">

            <!-- PHOTO -->
            <div class="photo-row">
                <div class="photo-wrapper">
                    <img id="photoPreview" src="/hub/default-single.png" alt="Profile photo">
                    <div class="ring-loader" id="ringLoader"></div>
                </div>
                <div class="photo-actions">
                    <button class="photo-btn" type="button" onclick="document.getElementById('photoInput').click()">
                        Upload New Photo
                    </button>
                    <span class="photo-hint">
                        Clear, front-facing photo works best. JPG or PNG recommended.
                    </span>
                    <input id="photoInput" type="file" accept="image/*" style="display:none;">
                </div>
            </div>

            <!-- SINGLE -->
            <div id="singleFields">
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Your full name">
            </div>

            <!-- COUPLE -->
            <div id="coupleFields" style="display:none;">
                <label for="teamName">Team Name</label>
                <input id="teamName" type="text" placeholder="e.g., The Dover Duo">

                <label for="partner1">Partner 1 Name</label>
                <input id="partner1" type="text" placeholder="First partner's name">

                <label for="partner2">Partner 2 Name</label>
                <input id="partner2" type="text" placeholder="Second partner's name">
            </div>

            <!-- SHARED -->
            <label for="phone">Phone</label>
            <input id="phone" type="text" placeholder="Contact number for job updates">

            <label for="location">Location</label>
            <input id="location" type="text" placeholder="e.g., Dover, Kent">

            <label for="bio">Bio</label>
            <textarea id="bio" placeholder="Tell couples a bit about yourself…"></textarea>

            <div class="save-bar">
                <button class="save-btn" type="button" onclick="saveProfile()" disabled>Save Changes</button>
            </div>
            <div id="statusMessage"></div>
        </div>
    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<script>
const WORKER_URL = "https://shrill-math-1bfc.pointlessproductions2020.workers.dev/";

// DOM refs
const photoInput = document.getElementById("photoInput");
const photoPreview = document.getElementById("photoPreview");
const ringLoader = document.getElementById("ringLoader");
const saveBtn = document.querySelector(".save-btn");
const statusMessage = document.getElementById("statusMessage");

const singleFields = document.getElementById("singleFields");
const coupleFields = document.getElementById("coupleFields");

const nameInput = document.getElementById("name");
const teamNameInput = document.getElementById("teamName");
const partner1Input = document.getElementById("partner1");
const partner2Input = document.getElementById("partner2");
const phoneInput = document.getElementById("phone");
const locationInput = document.getElementById("location");
const bioInput = document.getElementById("bio");

// Holds compressed image blob
let compressedBlob = null;

/* LOADER CONTROL */
function showLoader() {
    ringLoader.style.display = "block";
    saveBtn.disabled = true;
    saveBtn.style.opacity = "0.5";
}

function hideLoader() {
    ringLoader.style.display = "none";
    saveBtn.disabled = false;
    saveBtn.style.opacity = "1";
}

/* IMAGE PREVIEW + COMPRESSION */
photoInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    showLoader();
    statusMessage.textContent = "Processing photo…";
    statusMessage.style.color = "#c8a24a";

    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = () => {
        const size = 512;
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = size;
        canvas.height = size;

        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2;
        const sy = (img.height - minSide) / 2;

        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

        canvas.toBlob(
            (blob) => {
                compressedBlob = blob;
                photoPreview.src = URL.createObjectURL(blob);

                hideLoader();
                statusMessage.textContent = "Photo ready.";
                statusMessage.style.color = "#2e7d32";
            },
            "image/jpeg",
            0.85
        );
    };
});

/* UPLOAD PHOTO */
async function uploadPhoto(uid) {
    if (!photoInput.files.length) return null;

    if (!compressedBlob) {
        statusMessage.textContent = "Please wait… processing photo.";
        statusMessage.style.color = "#c0392b";
        return null;
    }

    const file = compressedBlob;

    // Reject oversized files BEFORE upload
    if (file.size > 5 * 1024 * 1024) {
        statusMessage.textContent = "Image too large — please choose a smaller one.";
        statusMessage.style.color = "#c0392b";
        return null;
    }

    showLoader();
    statusMessage.textContent = "Uploading…";
    statusMessage.style.color = "#c8a24a";

    const formData = new FormData();
    formData.append("file", file, `${uid}.jpg`);

    try {
        const res = await fetch(WORKER_URL, {
            method: "POST",
            body: formData
        });

        if (!res.ok) {
            hideLoader();
            console.error("Upload failed:", await res.text());
            statusMessage.textContent = "Upload failed — please try again.";
            statusMessage.style.color = "#c0392b";
            return null;
        }

        const json = await res.json();
        hideLoader();

        statusMessage.textContent = "Upload complete!";
        statusMessage.style.color = "#2e7d32";

        return json.url || null;

    } catch (err) {
        hideLoader();
        console.error("Upload failed:", err);
        statusMessage.textContent = "Network error — please try again.";
        statusMessage.style.color = "#c0392b";
        return null;
    }
}

/* LOAD USER DATA */
auth.onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const doc = await db.collection("users").doc(user.uid).get();
    if (!doc.exists) return;

    const data = doc.data();

    // Load photo
    if (data.photoURL) {
        photoPreview.src = data.photoURL;
    } else {
        photoPreview.src = data.type === "couple"
            ? "/hub/default-couple.png"
            : "/hub/default-single.png";
    }

    // Show correct fields
    if (data.type === "couple") {
        singleFields.style.display = "none";
        coupleFields.style.display = "block";

        teamNameInput.value = data.teamName || "";
        partner1Input.value = data.partner1Name || "";
        partner2Input.value = data.partner2Name || "";
    } else {
        singleFields.style.display = "block";
        coupleFields.style.display = "none";

        nameInput.value = data.name || "";
    }

    phoneInput.value = data.phone || "";
    locationInput.value = data.location || "";
    bioInput.value = data.bio || "";

    saveBtn.disabled = false;
});

/* SAVE PROFILE */
async function saveProfile() {
    const user = auth.currentUser;
    if (!user) return;

    statusMessage.textContent = "Saving your profile…";
    statusMessage.style.color = "#777";

    const doc = await db.collection("users").doc(user.uid).get();
    const data = doc.data() || {};

    const safeTrim = (val) => (val || "").toString().trim();

    let updatedData = {
        phone: safeTrim(phoneInput.value),
        location: safeTrim(locationInput.value),
        bio: safeTrim(bioInput.value),
    };

    // Upload photo if selected
    const photoURL = await uploadPhoto(user.uid);
    if (photoURL) {
        updatedData.photoURL = photoURL;
    }

    // Name fields
    if (data.type === "couple") {
        updatedData.teamName = safeTrim(teamNameInput.value);
        updatedData.partner1Name = safeTrim(partner1Input.value);
        updatedData.partner2Name = safeTrim(partner2Input.value);
    } else {
        updatedData.name = safeTrim(nameInput.value);
    }

    await db.collection("users").doc(user.uid).update(updatedData);

    statusMessage.textContent = "Profile updated successfully.";
    statusMessage.style.color = "#2e7d32";

   setTimeout(() => {
        window.location.href = "profile.html";
    }, 800);
}

/* LOGOUT */
function logout() {
    auth.signOut().then(() => {
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
