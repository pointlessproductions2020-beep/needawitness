<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile – Witness Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #f5f4f2;
        color: #333;
    }

    .layout {
        display: flex;
        min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
        width: 250px;
        background: #ffffff;
        border-right: 1px solid #e6e2da;
        padding: 28px;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 10px rgba(0,0,0,0.04);
    }

    .sidebar h2 {
        font-family: "Playfair Display", serif;
        color: #c8a24a;
        margin: 0 0 32px 0;
        font-size: 26px;
        letter-spacing: 0.5px;
    }

    .sidebar a {
        color: #444;
        text-decoration: none;
        padding: 12px 0;
        display: block;
        font-size: 15px;
        font-weight: 500;
        transition: 0.2s;
    }

    .sidebar a:hover {
        color: #c8a24a;
        transform: translateX(3px);
    }

    .sidebar a.active {
        color: #c8a24a;
        font-weight: 600;
    }

    .logout-btn {
        margin-top: auto;
        padding: 12px;
        background: #c8a24a;
        color: white;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: 0.2s;
    }

    .logout-btn:hover {
        opacity: 0.9;
    }

    /* MAIN */
    .main {
        flex: 1;
        padding: 40px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
    }

    .header {
        font-size: 32px;
        font-family: "Playfair Display", serif;
        color: #c8a24a;
        margin-bottom: 6px;
        text-align: center;
    }

    .subheader {
        font-size: 14px;
        color: #777;
        margin-bottom: 28px;
        text-align: center;
    }

    .edit-card {
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 10px 26px rgba(0,0,0,0.06);
        padding: 30px 32px 26px;
        max-width: 640px;
        width: 100%;
        animation: fadeInUp 0.4s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .photo-wrapper {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 3px solid #c8a24a;
        overflow: hidden;
        margin: 0 auto 20px auto;
        background: #faf7ec;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #previewPhoto {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .ring-loader {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 6px solid rgba(200,162,74,0.25);
        border-top-color: #c8a24a;
        animation: ringSpin 1s linear infinite;
        display: none;
        z-index: 10;
    }

    @keyframes ringSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        font-size: 14px;
        font-weight: 600;
        color: #7a642e;
        display: block;
        margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 14px;
        font-family: Inter, sans-serif;
        background: #fff;
    }

    textarea {
        resize: vertical;
        min-height: 90px;
    }

    .save-btn {
        width: 100%;
        padding: 12px;
        background: #c8a24a;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.2s;
    }

    .save-btn:hover {
        opacity: 0.9;
    }

</style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Witness Hub</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="myjobs.html">My Jobs</a>
        <a href="availability.html">Availability</a>
        <a href="profile.html">Profile</a>
        <a href="profile-edit.html" class="active">Edit Profile</a>

        <div class="logout-btn" onclick="logout()">Logout</div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="header">Edit Your Profile</div>
        <div class="subheader">Update your details so couples can get to know you.</div>

        <div class="edit-card">

            <div class="photo-wrapper">
                <img id="previewPhoto" src="/hub/default-single.png">
                <div class="ring-loader" id="ringLoader"></div>
            </div>

            <input type="file" id="photoInput" accept="image/*">

            <div class="form-group">
                <label>Witness Type</label>
                <select id="type">
                    <option value="single">Single Witness</option>
                    <option value="couple">Couple Witness Team</option>
                </select>
            </div>

            <div id="singleFields">
                <div class="form-group">
                    <label>Your Name</label>
                    <input id="name" type="text">
                </div>
            </div>

            <div id="coupleFields" style="display:none;">
                <div class="form-group">
                    <label>Team Name</label>
                    <input id="teamName" type="text">
                </div>

                <div class="form-group">
                    <label>Partner 1 Name</label>
                    <input id="partner1Name" type="text">
                </div>

                <div class="form-group">
                    <label>Partner 2 Name</label>
                    <input id="partner2Name" type="text">
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input id="phone" type="text">
            </div>

            <div class="form-group">
                <label>Location</label>
                <input id="location" type="text">
            </div>

            <div class="form-group">
                <label>Bio</label>
                <textarea id="bio"></textarea>
            </div>

            <button class="save-btn" id="saveBtn">Save Changes</button>

        </div>
    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<script>
const photoInput = document.getElementById("photoInput");
const previewPhoto = document.getElementById("previewPhoto");
const ringLoader = document.getElementById("ringLoader");

let uploadedPhotoURL = null;

/* LOAD USER DATA */
auth.onAuthStateChanged(async user => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const doc = await db.collection("users").doc(user.uid).get();
    const data = doc.data() || {};

    // Load photo
    previewPhoto.src = data.photoURL || "/hub/default-single.png";

    // Load fields
    document.getElementById("type").value = data.type || "single";
    document.getElementById("name").value = data.name || "";
    document.getElementById("teamName").value = data.teamName || "";
    document.getElementById("partner1Name").value = data.partner1Name || "";
    document.getElementById("partner2Name").value = data.partner2Name || "";
    document.getElementById("phone").value = data.phone || "";
    document.getElementById("location").value = data.location || "";
    document.getElementById("bio").value = data.bio || "";

    toggleFields();
});

/* TOGGLE SINGLE/COUPLE FIELDS */
document.getElementById("type").addEventListener("change", toggleFields);

function toggleFields() {
    const type = document.getElementById("type").value;
    document.getElementById("singleFields").style.display = type === "single" ? "block" : "none";
    document.getElementById("coupleFields").style.display = type === "couple" ? "block" : "none";
}

/* PHOTO UPLOAD */
photoInput.addEventListener("change", async () => {
    const file = photoInput.files[0];
    if (!file) return;

    ringLoader.style.display = "block";

    const reader = new FileReader();
    reader.onload = e => {
        previewPhoto.src = e.target.result;
    };
    reader.readAsDataURL(file);

    // Upload to Cloudflare Worker
    const formData = new FormData();
    formData.append("file", file);

    const upload = await fetch("https://needawitness-worker.mystery.workers.dev", {
        method: "POST",
        body: formData
    });

    const result = await upload.json();
    uploadedPhotoURL = result.url;

    ringLoader.style.display = "none";
});

/* SAVE CHANGES */
document.getElementById("saveBtn").addEventListener("click", async () => {
    const user = auth.currentUser;
    if (!user) return;

    const type = document.getElementById("type").value;

    const payload = {
        type,
        name: document.getElementById("name").value.trim(),
        teamName: document.getElementById("teamName").value.trim(),
        partner1Name: document.getElementById("partner1Name").value.trim(),
        partner2Name: document.getElementById("partner2Name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        location: document.getElementById("location").value.trim(),
        bio: document.getElementById("bio").value.trim(),
    };

    if (uploadedPhotoURL) {
        payload.photoURL = uploadedPhotoURL;
    }

    await db.collection("users").doc(user.uid).set(payload, { merge: true });

    window.location.href = "profile.html";
});

/* LOGOUT */
function logout() {
    auth.signOut().then(() => {
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
