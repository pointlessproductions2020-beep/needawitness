<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile – Witness Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #333;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Your Profile</h2>

    <label>Name</label>
    <input id="name" type="text">

    <label>Phone</label>
    <input id="phone" type="text">

    <label>Location</label>
    <input id="location" type="text" placeholder="e.g., Dover, Kent">

    <label>Bio</label>
    <textarea id="bio" placeholder="Tell couples a bit about yourself…"></textarea>

    <button onclick="saveProfile()">Save Changes</button>

    <a class="back-link" href="dashboard.html">← Back to Dashboard</a>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<!-- Your Firebase config -->
<script src="firebase.js"></script>

<script>
// Load user data into the form
auth.onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const doc = await db.collection("users").doc(user.uid).get();
    if (doc.exists) {
        const data = doc.data();

        document.getElementById("name").value = data.name || "";
        document.getElementById("phone").value = data.phone || "";
        document.getElementById("location").value = data.location || "";
        document.getElementById("bio").value = data.bio || "";
    }
});

// Save profile changes
async function saveProfile() {
    const user = auth.currentUser;
    if (!user) return;

    const updatedData = {
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        location: document.getElementById("location").value.trim(),
        bio: document.getElementById("bio").value.trim(),
    };

    await db.collection("users").doc(user.uid).update(updatedData);

    alert("Profile updated successfully");
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
