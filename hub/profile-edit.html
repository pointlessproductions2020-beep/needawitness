<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile – Witness Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #f5f4f2;
        color: #333;
    }

    .layout {
        display: flex;
        min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
        width: 250px;
        background: #ffffff;
        border-right: 1px solid #e6e2da;
        padding: 28px;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 10px rgba(0,0,0,0.04);
    }

    .sidebar h2 {
        font-family: "Playfair Display", serif;
        color: #c8a24a;
        margin: 0 0 32px 0;
        font-size: 26px;
        letter-spacing: 0.5px;
    }

    .sidebar a {
        color: #444;
        text-decoration: none;
        padding: 12px 0;
        display: block;
        font-size: 15px;
        font-weight: 500;
        transition: 0.2s;
    }

    .sidebar a:hover {
        color: #c8a24a;
        transform: translateX(3px);
    }

    .sidebar a.active {
        color: #c8a24a;
        font-weight: 600;
    }

    .logout-btn {
        margin-top: auto;
        padding: 12px;
        background: #c8a24a;
        color: white;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: 0.2s;
    }

    .logout-btn:hover {
        opacity: 0.9;
    }

    /* MAIN */
    .main {
        flex: 1;
        padding: 40px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
    }

    .header {
        font-size: 32px;
        font-family: "Playfair Display", serif;
        color: #c8a24a;
        margin-bottom: 6px;
        text-align: center;
    }

    .subheader {
        font-size: 14px;
        color: #777;
        margin-bottom: 28px;
        text-align: center;
    }

    .edit-card {
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 10px 26px rgba(0,0,0,0.06);
        padding: 30px 32px 26px;
        max-width: 640px;
        width: 100%;
        animation: fadeInUp 0.4s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .photo-wrapper {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 3px solid #c8a24a;
        overflow: hidden;
        margin: 0 auto 16px auto;
        background: #faf7ec;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .photo-wrapper.dragover {
        box-shadow: 0 0 0 3px rgba(200,162,74,0.4);
    }

    #previewPhoto {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .ring-loader {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 6px solid rgba(200,162,74,0.25);
        border-top-color: #c8a24a;
        animation: ringSpin 1s linear infinite;
        display: none;
        z-index: 10;
    }

    @keyframes ringSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .photo-hint {
        font-size: 12px;
        color: #777;
        text-align: center;
        margin-bottom: 18px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        font-size: 14px;
        font-weight: 600;
        color: #7a642e;
        display: block;
        margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 14px;
        font-family: Inter, sans-serif;
        background: #fff;
        box-sizing: border-box;
    }

    .form-group input.error,
    .form-group textarea.error,
    .form-group select.error {
        border-color: #d9534f;
    }

    .error-text {
        font-size: 12px;
        color: #d9534f;
        margin-top: 4px;
    }

    textarea {
        resize: vertical;
        min-height: 90px;
    }

    .save-btn {
        width: 100%;
        padding: 12px;
        background: #c8a24a;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.2s;
    }

    .save-btn:disabled {
        opacity: 0.6;
        cursor: default;
    }

    .save-btn:hover:not(:disabled) {
        opacity: 0.9;
    }

    /* TOAST */
    .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #2f7d32;
        color: #fff;
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 13px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.18);
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 9999;
    }

    .toast.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }

    .toast.error {
        background: #d9534f;
    }

    @media (max-width: 900px) {
        .layout {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            border-right: none;
            border-bottom: 1px solid #eee;
            flex-direction: row;
            align-items: center;
            gap: 18px;
            overflow-x: auto;
        }
        .sidebar h2 {
            margin-bottom: 0;
        }
        .sidebar a {
            padding: 8px 0;
            white-space: nowrap;
        }
        .logout-btn {
            display: none;
        }
        .main {
            padding: 24px;
        }
        .edit-card {
            padding: 24px 20px 20px;
        }
    }
</style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Witness Hub</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="myjobs.html">My Jobs</a>
        <a href="availability.html">Availability</a>
        <a href="profile.html">Profile</a>
        <a href="profile-edit.html" class="active">Edit Profile</a>

        <div class="logout-btn" onclick="logout()">Logout</div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="header">Edit Your Profile</div>
        <div class="subheader">Update your details so couples can get to know you.</div>

        <div class="edit-card">

            <div id="photoDrop" class="photo-wrapper">
                <img id="previewPhoto" src="/hub/default-single.png" alt="Profile photo">
                <div class="ring-loader" id="ringLoader"></div>
            </div>
            <div class="photo-hint">
                Click or drag & drop a photo to update your profile picture.
            </div>

            <input type="file" id="photoInput" accept="image/*" style="display:none;">

            <div class="form-group">
                <label for="type">Witness Type</label>
                <select id="type">
                    <option value="single">Single Witness</option>
                    <option value="couple">Couple Witness Team</option>
                </select>
                <div class="error-text" id="typeError"></div>
            </div>

            <div id="singleFields">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input id="name" type="text">
                    <div class="error-text" id="nameError"></div>
                </div>
            </div>

            <div id="coupleFields" style="display:none;">
                <div class="form-group">
                    <label for="teamName">Team Name</label>
                    <input id="teamName" type="text">
                    <div class="error-text" id="teamNameError"></div>
                </div>

                <div class="form-group">
                    <label for="partner1Name">Partner 1 Name</label>
                    <input id="partner1Name" type="text">
                    <div class="error-text" id="partner1Error"></div>
                </div>

                <div class="form-group">
                    <label for="partner2Name">Partner 2 Name</label>
                    <input id="partner2Name" type="text">
                    <div class="error-text" id="partner2Error"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input id="phone" type="text">
                <div class="error-text" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input id="location" type="text">
                <div class="error-text" id="locationError"></div>
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio"></textarea>
                <div class="error-text" id="bioError"></div>
            </div>

            <button class="save-btn" id="saveBtn">Save Changes</button>

        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<script>
const photoInput = document.getElementById("photoInput");
const photoDrop = document.getElementById("photoDrop");
const previewPhoto = document.getElementById("previewPhoto");
const ringLoader = document.getElementById("ringLoader");
const toast = document.getElementById("toast");
const saveBtn = document.getElementById("saveBtn");

let uploadedPhotoURL = null;
let autosaveTimer = null;
let initialLoaded = false;

/* TOAST */
function showToast(message, isError = false) {
    toast.textContent = message;
    toast.classList.toggle("error", isError);
    toast.classList.add("show");
    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}

/* SIMPLE CENTER CROP TO SQUARE */
function cropToSquare(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const size = Math.min(img.width, img.height);
                const sx = (img.width - size) / 2;
                const sy = (img.height - size) / 2;

                const canvas = document.createElement("canvas");
                canvas.width = 600;
                canvas.height = 600;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, sx, sy, size, size, 0, 0, 600, 600);

                canvas.toBlob(blob => {
                    if (!blob) return reject("Failed to crop");
                    resolve(blob);
                }, "image/jpeg", 0.9);
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

/* VALIDATION */
function clearErrors() {
    const fields = ["type","name","teamName","partner1Name","partner2Name","phone","location","bio"];
    fields.forEach(id => {
        const input = document.getElementById(id);
        if (input) input.classList.remove("error");
    });
    const errorIds = ["typeError","nameError","teamNameError","partner1Error","partner2Error","phoneError","locationError","bioError"];
    errorIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = "";
    });
}

function validateForm() {
    clearErrors();
    let valid = true;

    const type = document.getElementById("type").value;
    const name = document.getElementById("name").value.trim();
    const teamName = document.getElementById("teamName").value.trim();
    const partner1 = document.getElementById("partner1Name").value.trim();
    const partner2 = document.getElementById("partner2Name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const location = document.getElementById("location").value.trim();
    const bio = document.getElementById("bio").value.trim();

    if (!type) {
        document.getElementById("typeError").textContent = "Please select a witness type.";
        document.getElementById("type").classList.add("error");
        valid = false;
    }

    if (type === "single") {
        if (!name) {
            document.getElementById("nameError").textContent = "Please enter your name.";
            document.getElementById("name").classList.add("error");
            valid = false;
        }
    } else {
        if (!teamName) {
            document.getElementById("teamNameError").textContent = "Please enter a team name.";
            document.getElementById("teamName").classList.add("error");
            valid = false;
        }
        if (!partner1) {
            document.getElementById("partner1Error").textContent = "Please enter Partner 1's name.";
            document.getElementById("partner1Name").classList.add("error");
            valid = false;
        }
        if (!partner2) {
            document.getElementById("partner2Error").textContent = "Please enter Partner 2's name.";
            document.getElementById("partner2Name").classList.add("error");
            valid = false;
        }
    }

    if (phone && phone.length < 7) {
        document.getElementById("phoneError").textContent = "That phone number looks a bit short.";
        document.getElementById("phone").classList.add("error");
        valid = false;
    }

    if (!location) {
        document.getElementById("locationError").textContent = "Please add a general location.";
        document.getElementById("location").classList.add("error");
        valid = false;
    }

    if (!bio) {
        document.getElementById("bioError").textContent = "A short bio really helps couples get a feel for you.";
        document.getElementById("bio").classList.add("error");
        valid = false;
    }

    return valid;
}

/* AUTOSAVE */
function scheduleAutosave() {
    if (!initialLoaded) return; // don't autosave while loading
    if (autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
        saveProfile(true);
    }, 1500);
}

/* TOGGLE SINGLE/COUPLE FIELDS */
document.getElementById("type").addEventListener("change", () => {
    toggleFields();
    scheduleAutosave();
});

function toggleFields() {
    const type = document.getElementById("type").value;
    document.getElementById("singleFields").style.display = type === "single" ? "block" : "none";
    document.getElementById("coupleFields").style.display = type === "couple" ? "block" : "none";
}

/* PHOTO CLICK + DRAG & DROP */
photoDrop.addEventListener("click", () => photoInput.click());

photoDrop.addEventListener("dragover", (e) => {
    e.preventDefault();
    photoDrop.classList.add("dragover");
});

photoDrop.addEventListener("dragleave", () => {
    photoDrop.classList.remove("dragover");
});

photoDrop.addEventListener("drop", (e) => {
    e.preventDefault();
    photoDrop.classList.remove("dragover");
    const file = e.dataTransfer.files[0];
    if (file) handlePhotoFile(file);
});

photoInput.addEventListener("change", () => {
    const file = photoInput.files[0];
    if (file) handlePhotoFile(file);
});

async function handlePhotoFile(file) {
    try {
        ringLoader.style.display = "block";

        const croppedBlob = await cropToSquare(file);

        const reader = new FileReader();
        reader.onload = e => {
            previewPhoto.src = e.target.result;
        };
        reader.readAsDataURL(croppedBlob);

        const formData = new FormData();
        formData.append("file", croppedBlob, "profile.jpg");

        const upload = await fetch("https://needawitness-worker.mystery.workers.dev", {
            method: "POST",
            body: formData
        });

        const result = await upload.json();
        uploadedPhotoURL = result.url;

        showToast("Profile photo updated");
        scheduleAutosave();
    } catch (err) {
        console.error(err);
        showToast("Could not update photo", true);
    } finally {
        ringLoader.style.display = "none";
    }
}

/* LOAD USER DATA */
auth.onAuthStateChanged(async user => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const doc = await db.collection("users").doc(user.uid).get();
    const data = doc.data() || {};

    previewPhoto.src = data.photoURL || "/hub/default-single.png";

    document.getElementById("type").value = data.type || "single";
    document.getElementById("name").value = data.name || "";
    document.getElementById("teamName").value = data.teamName || "";
    document.getElementById("partner1Name").value = data.partner1Name || "";
    document.getElementById("partner2Name").value = data.partner2Name || "";
    document.getElementById("phone").value = data.phone || "";
    document.getElementById("location").value = data.location || "";
    document.getElementById("bio").value = data.bio || "";

    toggleFields();
    initialLoaded = true;
});

/* TRACK CHANGES FOR AUTOSAVE */
["name","teamName","partner1Name","partner2Name","phone","location","bio"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("input", scheduleAutosave);
});

/* SAVE BUTTON */
saveBtn.addEventListener("click", () => {
    saveProfile(false);
});

async function saveProfile(isAutosave) {
    const user = auth.currentUser;
    if (!user) return;

    if (!isAutosave) {
        if (!validateForm()) {
            showToast("Please fix the highlighted fields.", true);
            return;
        }
    }

    const type = document.getElementById("type").value;

    const payload = {
        type,
        name: document.getElementById("name").value.trim(),
        teamName: document.getElementById("teamName").value.trim(),
        partner1Name: document.getElementById("partner1Name").value.trim(),
        partner2Name: document.getElementById("partner2Name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        location: document.getElementById("location").value.trim(),
        bio: document.getElementById("bio").value.trim(),
    };

    if (uploadedPhotoURL) {
        payload.photoURL = uploadedPhotoURL;
    }

    try {
        saveBtn.disabled = true;
        await db.collection("users").doc(user.uid).set(payload, { merge: true });

        if (isAutosave) {
            showToast("Changes autosaved");
        } else {
            showToast("Profile saved");
            setTimeout(() => {
                window.location.href = "profile.html";
            }, 600);
        }
    } catch (err) {
        console.error(err);
        showToast("Could not save profile", true);
    } finally {
        saveBtn.disabled = false;
    }
}

/* LOGOUT */
function logout() {
    auth.signOut().then(() => {
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
