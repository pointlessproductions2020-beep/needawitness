<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability – Witness Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        .day {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .day label {
            font-weight: bold;
            display: block;
        }

        .time-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        input[type="time"] {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .toggle {
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #333;
        }

        .back {
            text-align: center;
            margin-top: 15px;
            display: block;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Your Availability</h2>

    <div id="days"></div>

    <button onclick="saveAvailability()">Save Availability</button>

    <a class="back" href="dashboard.html">← Back to Dashboard</a>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script>
const dayNames = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

auth.onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const container = document.getElementById("days");

    // Load existing availability
    const doc = await db.collection("users").doc(user.uid).get();
    const availability = doc.data().availability || {};

    dayNames.forEach(day => {
        const saved = availability[day] || { enabled: false, start: "09:00", end: "16:00" };

        container.innerHTML += `
            <div class="day">
                <label>${day}</label>
                <div class="toggle">
                    <input type="checkbox" id="${day}-enabled" ${saved.enabled ? "checked" : ""}>
                    <span>Available</span>
                </div>

                <div class="time-row">
                    <input type="time" id="${day}-start" value="${saved.start}">
                    <input type="time" id="${day}-end" value="${saved.end}">
                </div>
            </div>
        `;
    });
});

async function saveAvailability() {
    const user = auth.currentUser;
    if (!user) return;

    const availability = {};

    dayNames.forEach(day => {
        availability[day] = {
            enabled: document.getElementById(`${day}-enabled`).checked,
            start: document.getElementById(`${day}-start`).value,
            end: document.getElementById(`${day}-end`).value
        };
    });

    await db.collection("users").doc(user.uid).update({ availability });

    alert("Availability saved");
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
