<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Availability – Witness Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #f7f7f7;
        padding: 30px;
    }

    .container {
        max-width: 650px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        border-left: 4px solid #D4AF37;
    }

    h2 {
        text-align: center;
        margin-top: 0;
        font-family: "Playfair Display", serif;
        color: #D4AF37;
        font-size: 28px;
    }

    .day {
        margin-bottom: 22px;
        padding-bottom: 18px;
        border-bottom: 1px solid #eee;
    }

    .day label {
        font-weight: 600;
        display: block;
        font-size: 17px;
        margin-bottom: 6px;
    }

    .toggle {
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
    }

    .time-row {
        display: flex;
        gap: 12px;
        margin-top: 10px;
    }

    input[type="time"] {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #D4AF37;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;
        font-weight: 600;
        margin-top: 25px;
    }

    button:hover {
        opacity: 0.9;
    }

    .back {
        text-align: center;
        margin-top: 18px;
        display: block;
        color: #333;
        font-weight: 500;
        text-decoration: none;
    }

    .back:hover {
        color: #D4AF37;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Your Weekly Availability</h2>

    <div id="days"></div>

    <button onclick="saveAvailability()">Save Availability</button>

    <a class="back" href="dashboard.html">← Back to Dashboard</a>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<script>
const dayNames = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

auth.onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    const container = document.getElementById("days");

    // Load existing availability
    const doc = await db.collection("users").doc(user.uid).get();
    const availability = doc.data().availability || {};

    dayNames.forEach(day => {
        const saved = availability[day] || { enabled: false, start: "09:00", end: "16:00" };

        container.innerHTML += `
            <div class="day">
                <label>${day}</label>

                <div class="toggle">
                    <input type="checkbox" id="${day}-enabled" ${saved.enabled ? "checked" : ""}>
                    <span>Available</span>
                </div>

                <div class="time-row">
                    <input type="time" id="${day}-start" value="${saved.start}">
                    <input type="time" id="${day}-end" value="${saved.end}">
                </div>
            </div>
        `;
    });
});

async function saveAvailability() {
    const user = auth.currentUser;
    if (!user) return;

    const availability = {};

    dayNames.forEach(day => {
        availability[day] = {
            enabled: document.getElementById(`${day}-enabled`).checked,
            start: document.getElementById(`${day}-start`).value,
            end: document.getElementById(`${day}-end`).value
        };
    });

    await db.collection("users").doc(user.uid).update({ availability });

    alert("Availability saved successfully");
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
