<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – Need A Witness UK</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: #f7f7f7;
        font-family: Inter, sans-serif;
    }

    .container {
        max-width: 420px;
        margin: 60px auto;
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        border-top: 4px solid #D4AF37;
    }

    h1 {
        font-family: "Playfair Display", serif;
        color: #D4AF37;
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        display: block;
        margin-top: 12px;
    }

    input, select {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    .btn {
        width: 100%;
        padding: 14px;
        background: #D4AF37;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 20px;
    }

    .btn:hover {
        background: #c19c2f;
    }

    .link {
        text-align: center;
        margin-top: 14px;
        font-size: 14px;
    }

    .link a {
        color: #D4AF37;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Become a Witness</h1>

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Your full name">

    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label>Password</label>
    <input type="password" id="password" placeholder="Choose a password">

    <label>Phone Number</label>
    <input type="text" id="phone" placeholder="07...">

    <label>Location</label>
    <input type="text" id="location" placeholder="City or town">

    <label>Witness Type</label>
    <select id="type">
        <option value="single">Single Witness</option>
        <option value="couple">Couple Team</option>
    </select>

    <div id="coupleFields" style="display:none;">
        <label>Partner 1 Name</label>
        <input type="text" id="partner1Name">

        <label>Partner 2 Name</label>
        <input type="text" id="partner2Name">

        <label>Team Name (optional)</label>
        <input type="text" id="teamName" placeholder="e.g., The Smiths">
    </div>

    <button class="btn" onclick="register()">Create Account</button>

    <div class="link">
        Already registered? <a href="login.html">Login</a>
    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<script>
document.getElementById("type").addEventListener("change", function() {
    document.getElementById("coupleFields").style.display =
        this.value === "couple" ? "block" : "none";
});

async function register() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const location = document.getElementById("location").value.trim();
    const type = document.getElementById("type").value;

    if (!name || !email || !password || !phone) {
        alert("Please fill in all required fields.");
        return;
    }

    try {
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;

        const userData = {
            name,
            email,
            phone,
            location,
            type,

            // Couple fields
            partner1Name: type === "couple" ? document.getElementById("partner1Name").value.trim() : null,
            partner2Name: type === "couple" ? document.getElementById("partner2Name").value.trim() : null,
            teamName: type === "couple" ? document.getElementById("teamName").value.trim() : null,

            // NEW APPROVAL SYSTEM FIELDS
            approved: false,
            status: "pending",
            rating: 0,
            suspended: false,
            photoURL: null,
            adminNotes: "",
            idPhotoURL: null,
            selfiePhotoURL: null,

            // Availability placeholder
            availability: {},

            createdAt: new Date().toISOString()
        };

        await db.collection("users").doc(uid).set(userData);

        alert("Account created! Please wait for approval.");
        window.location.href = "pending.html";

    } catch (error) {
        console.error(error);
        alert(error.message);
    }
}
</script>

</body>
</html>
