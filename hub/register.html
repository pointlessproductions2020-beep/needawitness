<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witness Hub – Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f7f7f7;
            font-family: Inter, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-card {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            border-top: 4px solid #D4AF37;
            text-align: center;
        }

        h2 {
            font-family: "Playfair Display", serif;
            color: #D4AF37;
            margin-bottom: 25px;
            font-size: 26px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            background: #fafafa;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #D4AF37;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .link {
            margin-top: 15px;
            display: block;
            font-size: 14px;
            color: #333;
            text-decoration: none;
        }

        .link:hover {
            color: #D4AF37;
        }

        .error {
            color: red;
            font-size: 14px;
            min-height: 20px;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="register-card">
    <h2>Create Your Witness Account</h2>

    <div class="error" id="error"></div>

    <select id="witnessType">
        <option value="single">Single Witness</option>
        <option value="couple">Couple Witness Team</option>
    </select>

    <input id="name" type="text" placeholder="Full Name">

    <input id="teamName" class="hidden" type="text" placeholder="Team Name (must be unique)">
    <input id="partner1" class="hidden" type="text" placeholder="Partner 1 Name">
    <input id="partner2" class="hidden" type="text" placeholder="Partner 2 Name">

    <input id="email" type="email" placeholder="Email">
    <input id="phone" type="text" placeholder="Phone Number">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Register</button>

    <a class="link" href="login.html">Already have an account? Login</a>
</div>

<script src="firebase.js"></script>

<script>
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Redirect if logged in
    auth.onAuthStateChanged(user => {
        if (user) window.location.href = "dashboard.html";
    });

    // Toggle fields based on witness type
    document.getElementById("witnessType").addEventListener("change", function () {
        const type = this.value;

        document.getElementById("name").classList.toggle("hidden", type === "couple");
        document.getElementById("teamName").classList.toggle("hidden", type === "single");
        document.getElementById("partner1").classList.toggle("hidden", type === "single");
        document.getElementById("partner2").classList.toggle("hidden", type === "single");
    });

    async function isTeamNameTaken(name) {
        const snap = await db.collection("users")
            .where("teamName", "==", name.toLowerCase())
            .get();
        return !snap.empty;
    }

    async function register() {
        const errorBox = document.getElementById("error");
        errorBox.textContent = "";

        const type = document.getElementById("witnessType").value;
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const pass = document.getElementById("password").value.trim();

        if (!email || !phone || !pass) {
            errorBox.textContent = "Please fill in all required fields.";
            return;
        }

        if (pass.length < 6) {
            errorBox.textContent = "Password must be at least 6 characters.";
            return;
        }

        let userData = {
            email: email,
            phone: phone,
            availability: {},
            createdAt: new Date()
        };

        if (type === "single") {
            const name = document.getElementById("name").value.trim();
            if (!name) {
                errorBox.textContent = "Please enter your name.";
                return;
            }

            userData.type = "single";
            userData.name = name;
            userData.teamName = null;

        } else {
            const teamName = document.getElementById("teamName").value.trim().toLowerCase();
            const partner1 = document.getElementById("partner1").value.trim();
            const partner2 = document.getElementById("partner2").value.trim();

            if (!teamName || !partner1 || !partner2) {
                errorBox.textContent = "Please fill in all couple team fields.";
                return;
            }

            if (await isTeamNameTaken(teamName)) {
                errorBox.textContent = "This team name is already taken.";
                return;
            }

            userData.type = "couple";
            userData.teamName = teamName;
            userData.partner1Name = partner1;
            userData.partner2Name = partner2;
        }

        auth.createUserWithEmailAndPassword(email, pass)
            .then(async cred => {
                await db.collection("users").doc(cred.user.uid).set(userData);
                window.location.href = "dashboard.html";
            })
            .catch(err => {
                errorBox.textContent = err.message;
            });
    }
</script>

</body>
</html>
