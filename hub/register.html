<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Witness Hub – Register</title>

    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            width: 360px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #333;
        }

        p {
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #000;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            opacity: 0.7;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Create Your Witness Account</h1>

    <!-- Witness Type -->
    <select id="witnessType">
        <option value="single">Single Witness</option>
        <option value="couple">Couple Witness Team</option>
    </select>

    <!-- Single Witness Fields -->
    <input id="name" type="text" placeholder="Full Name">

    <!-- Couple Witness Fields -->
    <input id="teamName" class="hidden" type="text" placeholder="Team Name (must be unique)">
    <input id="partner1" class="hidden" type="text" placeholder="Partner 1 Name">
    <input id="partner2" class="hidden" type="text" placeholder="Partner 2 Name">

    <!-- Shared Fields -->
    <input id="email" type="email" placeholder="Email">
    <input id="phone" type="text" placeholder="Phone Number">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">Register</button>

    <p>Already have an account? <a href="login.html">Login here</a></p>
</div>

<script src="firebase.js"></script>

<script>
// Show/hide fields based on witness type
document.getElementById("witnessType").addEventListener("change", function () {
    const type = this.value;

    document.getElementById("name").classList.toggle("hidden", type === "couple");
    document.getElementById("teamName").classList.toggle("hidden", type === "single");
    document.getElementById("partner1").classList.toggle("hidden", type === "single");
    document.getElementById("partner2").classList.toggle("hidden", type === "single");
});

// Check if team name is unique
async function isTeamNameTaken(name) {
    const snap = await db.collection("users").where("teamName", "==", name).get();
    return !snap.empty;
}

async function register() {
    const type = document.getElementById("witnessType").value;
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const pass = document.getElementById("password").value.trim();

    let userData = {
        email: email,
        phone: phone,
        availability: {},
        createdAt: new Date()
    };

    if (type === "single") {
        const name = document.getElementById("name").value.trim();
        if (!name) return alert("Please enter your name.");

        userData.type = "single";
        userData.name = name;
        userData.teamName = null;

    } else {
        const teamName = document.getElementById("teamName").value.trim();
        const partner1 = document.getElementById("partner1").value.trim();
        const partner2 = document.getElementById("partner2").value.trim();

        if (!teamName || !partner1 || !partner2)
            return alert("Please fill in all couple team fields.");

        if (await isTeamNameTaken(teamName))
            return alert("Sorry, this team name is already taken.");

        userData.type = "couple";
        userData.teamName = teamName;
        userData.partner1Name = partner1;
        userData.partner2Name = partner2;
    }

    auth.createUserWithEmailAndPassword(email, pass)
        .then(async cred => {
            await db.collection("users").doc(cred.user.uid).set(userData);
            window.location.href = "dashboard.html";
        })
        .catch(err => alert(err.message));
}
</script>

</body>
</html>
