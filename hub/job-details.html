<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Details – Witness Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #f5f4f2;
        color: #222;
        overflow: hidden;
    }

    /* SIDEBAR */
    .layout {
        display: flex;
        height: 100vh;
    }

    .sidebar {
        width: 250px;
        background: #ffffff;
        border-right: 1px solid #e6e2da;
        padding: 28px;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 10px rgba(0,0,0,0.04);
    }

    .sidebar h2 {
        font-family: "Playfair Display", serif;
        color: #c8a24a;
        margin: 0 0 32px 0;
        font-size: 26px;
        letter-spacing: 0.5px;
    }

    .sidebar a {
        color: #444;
        text-decoration: none;
        padding: 12px 0;
        display: block;
        font-size: 15px;
        font-weight: 500;
        transition: 0.2s;
    }

    .sidebar a:hover {
        color: #c8a24a;
        transform: translateX(3px);
    }

    .logout-btn {
        margin-top: auto;
        padding: 12px;
        background: #c8a24a;
        color: white;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: 0.2s;
    }

    .logout-btn:hover {
        opacity: 0.9;
    }

    .sidebar-footer {
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid #eee;
        font-size: 12px;
        color: #777;
        line-height: 1.4;
    }

    /* OVERLAY */
    #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    #overlay.open {
        opacity: 1;
        pointer-events: all;
    }

    /* CINEMATIC GLASS PANEL */
    #glassPanel {
        width: 600px;
        max-width: 92%;
        max-height: 90vh;
        padding: 28px;
        border-radius: 20px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        border: 1px solid rgba(255,255,255,0.25);
        box-shadow: 0 18px 40px rgba(0,0,0,0.55);
        color: #fff;
        transform: scale(0.85);
        opacity: 0;
        transition: transform 0.28s ease, opacity 0.28s ease;
        overflow-y: auto;
    }

    #glassPanel.open {
        transform: scale(1);
        opacity: 1;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .panel-header h2 {
        margin: 0;
        font-family: "Playfair Display", serif;
        font-size: 24px;
        color: #f5f5f5;
    }

    .close-btn {
        font-size: 30px;
        cursor: pointer;
        color: #c8a24a;
        font-weight: bold;
    }

    .section {
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid rgba(255,255,255,0.25);
    }

    .section h4 {
        margin: 0 0 8px 0;
        font-size: 15px;
        color: #f5f5f5;
    }

    .section div {
        font-size: 14px;
        color: #ddd;
        margin-bottom: 10px;
    }

    .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        margin-left: 10px;
    }

    .pending { background: #fff4d6; color: #8a6d00; }
    .assigned { background: #d6ffe0; color: #006d2a; }
    .completed { background: #e6e6e6; color: #555; }

    .btn {
        margin-top: 20px;
        padding: 12px;
        background: #c8a24a;
        color: #1e1e1e;
        border: none;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        font-size: 14px;
        transition: 0.2s;
    }

    .btn:hover {
        opacity: 0.9;
    }

    .btn.cancel {
        background: #555;
        color: #fff;
    }
</style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Witness Hub</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="myjobs.html">My Jobs</a>
        <a href="availability.html">Availability</a>
        <a href="profile.html">Profile</a>

        <div class="logout-btn" onclick="logout()">Logout</div>

        <div class="sidebar-footer">
            © Need A Witness UK<br>
            Witness Hub v1.0
        </div>
    </div>

</div>

<!-- CINEMATIC OVERLAY -->
<div id="overlay">
    <div id="glassPanel">
        <div class="panel-header">
            <h2 id="jobTitle">Job Details</h2>
            <div class="close-btn" onclick="closePanel()">×</div>
        </div>

        <div id="jobContent">Loading…</div>
    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<script>
let currentUser = null;
let jobId = new URLSearchParams(window.location.search).get("id");

auth.onAuthStateChanged(async user => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;
    openPanel();
    loadJob();
});

/* OPEN PANEL */
function openPanel() {
    const overlay = document.getElementById("overlay");
    const panel = document.getElementById("glassPanel");

    overlay.classList.add("open");
    requestAnimationFrame(() => {
        panel.classList.add("open");
    });
}

/* CLOSE PANEL */
function closePanel() {
    const overlay = document.getElementById("overlay");
    const panel = document.getElementById("glassPanel");

    panel.classList.remove("open");
    setTimeout(() => {
        overlay.classList.remove("open");
        window.location.href = "myjobs.html";
    }, 280);
}

/* LOAD JOB DETAILS */
async function loadJob() {
    const doc = await db.collection("jobs").doc(jobId).get();
    if (!doc.exists) {
        jobContent.innerHTML = "<p>Job not found.</p>";
        return;
    }

    const j = doc.data();

    document.getElementById("jobTitle").textContent = j.coupleName;

    const badge = j.status === "pending" ? "pending" :
                  j.status === "assigned" ? "assigned" :
                  j.status === "completed" ? "completed" : "pending";

    let assignedList = "None";
    if (j.assignedWitnesses?.length) {
        assignedList = j.assignedWitnesses.join(", ");
    }

    jobContent.innerHTML = `
        <div class="section">
            <h4>Date & Time</h4>
            <div>${j.date}</div>
            <div>${j.time}</div>
        </div>

        <div class="section">
            <h4>Location</h4>
            <div>${j.location}</div>
        </div>

        <div class="section">
            <h4>Notes</h4>
            <div>${j.notes || "None"}</div>
        </div>

        <div class="section">
            <h4>Status</h4>
            <div>
                <span class="status-badge ${badge}">${j.status}</span>
            </div>
        </div>

        <div class="section">
            <h4>Assigned Witnesses</h4>
            <div>${assignedList}</div>
        </div>

        <a class="btn" href="https://www.google.com/maps/search/${encodeURIComponent(j.location)}" target="_blank">
            Open in Maps
        </a>

        ${renderButtons(j)}
    `;
}

/* BUTTON LOGIC */
function renderButtons(j) {
    const uid = currentUser.uid;

    if (j.assignedWitnesses?.includes(uid)) {
        return `<button class="btn" onclick="markCompleted()">Mark Completed</button>`;
    }

    if (j.requestBy === uid && j.requestStatus === "pending") {
        return `<button class="btn cancel" onclick="cancelRequest()">Cancel Request</button>`;
    }

    if (j.status === "pending") {
        return `<button class="btn" onclick="requestJob()">Request Job</button>`;
    }

    return "";
}

/* REQUEST JOB */
function requestJob() {
    db.collection("jobs").doc(jobId).update({
        requestBy: currentUser.uid,
        requestTeamName: "Witness",
        requestStatus: "pending"
    });

    loadJob();
}

/* CANCEL REQUEST */
function cancelRequest() {
    db.collection("jobs").doc(jobId).update({
        requestBy: "",
        requestTeamName: "",
        requestStatus: null
    });

    loadJob();
}

/* MARK COMPLETED */
function markCompleted() {
    db.collection("jobs").doc(jobId).update({
        status: "completed"
    });

    loadJob();
}

/* LOGOUT */
function logout() {
    auth.signOut().then(() => {
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
