<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Witness Hub – Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #f7f7f7;
        font-family: Inter, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-card {
        background: white;
        width: 380px;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        text-align: center;
        border-top: 4px solid #D4AF37;
    }

    h2 {
        font-family: "Playfair Display", serif;
        color: #D4AF37;
        margin-bottom: 25px;
        font-size: 26px;
    }

    input {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
        background: #fafafa;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #D4AF37;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;
        font-weight: 600;
        margin-top: 10px;
    }

    button:hover {
        opacity: 0.9;
    }

    .link {
        margin-top: 15px;
        display: block;
        font-size: 14px;
        color: #333;
        text-decoration: none;
    }

    .link:hover {
        color: #D4AF37;
    }

    .error {
        color: red;
        font-size: 14px;
        min-height: 20px;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="login-card">
    <h2>Witness Hub Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="error" id="error"></div>

    <a class="link" href="register.html">Need an account? Register</a>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<!-- Your Firebase config (cache-busted) -->
<script src="firebase.js?v=9999"></script>

<script>
const auth = firebase.auth();

// Redirect if already logged in
auth.onAuthStateChanged(user => {
    if (user) {
        window.location.href = "dashboard.html";
    }
});

function login() {
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value.trim();
    const errorBox = document.getElementById("error");

    errorBox.textContent = "";

    if (!email || !pass) {
        errorBox.textContent = "Please enter both email and password.";
        return;
    }

    auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
            window.location.href = "dashboard.html";
        })
        .catch((error) => {
            errorBox.textContent = error.message;
        });
}
</script>

</body>
</html>
